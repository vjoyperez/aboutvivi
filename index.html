<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="vivi perez, art director"
    />
    <title>vivi perez, art director</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <article class="mac-window" aria-labelledby="record-title">
        <header class="title-bar">
          <div class="browser-tab-row">
            <div class="traffic-lights">
              <span class="traffic-light traffic-light--close" aria-hidden="true"></span>
              <button
                class="traffic-light traffic-light--minimize"
                type="button"
                aria-label="Minimize creative license record"
              ></button>
              <span class="expand-control">
                <button
                  class="traffic-light traffic-light--expand"
                  type="button"
                  aria-label="Expand creative license record"
                  aria-expanded="false"
                ></button>
                <span class="expand-cue-label" aria-hidden="true">expand me</span>
              </span>
            </div>
            <button
              class="tab-menu-button"
              type="button"
              aria-label="Show file menu"
              aria-expanded="false"
              data-tab-menu
            ></button>
            <div class="browser-tab">
              <span class="tab-favicon" aria-hidden="true">
                <img src="assets/favicon.png" alt="" />
              </span>
              <p class="window-title">vivi perez, art director</p>
              <button class="tab-close" type="button" aria-label="Close tab" data-tab-close></button>
            </div>
          </div>
          <div class="tab-dropdown" data-tab-dropdown hidden>
            <button type="button" data-menu-artifact="creative-license">creative license</button>
            <button type="button" data-menu-artifact="about">about.pdf</button>
            <button type="button" data-menu-artifact="resume">resume.pdf</button>
            <button type="button" data-menu-artifact="linkedin">linkedin</button>
            <button type="button" data-menu-artifact="email">email</button>
            <button type="button" data-menu-artifact="dj-board">pioneer-ddjsb3.png</button>
            <button type="button" data-menu-artifact="everynoise">everynoise.com</button>
          </div>
          <div class="browser-toolbar">
            <button class="browser-nav-button" type="button" aria-label="Back" data-browser-back></button>
            <button class="browser-nav-button browser-nav-button--forward" type="button" aria-label="Forward" data-browser-forward></button>
            <button class="browser-refresh-button" type="button" aria-label="Refresh and reset" data-browser-refresh></button>
            <div class="address-bar" aria-label="Current URL" data-address-bar>
              <span class="address-info" aria-hidden="true">i</span>
              <span class="address-prefix" aria-hidden="true">vperez.world/</span>
              <input
                class="address-input"
                type="text"
                value="about"
                aria-label="Page path"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                data-address-input
              />
              <div class="address-suggestions" data-address-suggestions hidden></div>
            </div>
            <button
              class="browser-star-button"
              type="button"
              aria-label="Bookmark page"
              aria-pressed="false"
              data-browser-star
            ></button>
          </div>
        </header>

        <div class="record-scroll" tabindex="0">
          <section
            class="intro-screen"
            aria-label="It's my world, and you're scrolling in it."
          >
            <p class="intro-copy" aria-hidden="true"></p>
          </section>
          <div class="record-paper">
            <h1 class="sr-only" id="record-title">Interactive about gallery</h1>
            <section
              class="artifact-gallery"
              aria-label="Interactive portfolio and about artifacts"
              data-artifact-gallery
            >
              <div class="focus-tools" data-focus-tools hidden>
                <button class="focus-tool focus-tool--open" type="button" data-focus-open>
                  open in new tab
                </button>
              </div>
              <div class="artifact-stage" data-artifact-stage role="list"></div>
            </section>
          </div>
        </div>
        <div class="scroll-progress" aria-hidden="true"><span></span></div>
      </article>
    </main>
  </body>
</html>
